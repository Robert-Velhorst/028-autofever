<script>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID();
const clone=x=>structuredClone(x);
const channels=['WhatsApp','SMS','Email','Push'];
const seed={version:1,owner:'Robert',defaultId:'ill',contacts:[{id:'maya',name:'Maya',group:'Familie',phone:'',email:'',channels:['WhatsApp']},{id:'jules',name:'Jules',group:'Werk',phone:'',email:'',channels:['Email']},{id:'lou',name:'Lou',group:'Vrienden',phone:'',email:'',channels:['SMS']}],profiles:[
{id:'ill',name:'Plots ziek',message:'Ik ben onverwacht ziek en neem rust. Hieronder staat waarmee je me kunt helpen.',recovery:'Ik voel me weer beter. Bedankt voor je hulp!',duration:'',checkin:4,recipients:['maya','jules','lou'],overrides:{jules:'Ik ben ziek en kan vandaag niet werken. Ik houd je op de hoogte.'},tasks:[{id:'food',title:'Boodschappen',description:'Brood, fruit en soep graag. Zet ze gerust bij de deur.',assignees:['maya']},{id:'call',title:'Even contact',description:'Stuur vanavond even een berichtje.',assignees:['lou']}]},
{id:'migraine',name:'Migraine',message:'Ik heb migraine en heb rust nodig. Graag berichten in plaats van bellen.',recovery:'De migraine is voorbij. Bedankt voor je begrip.',duration:'',checkin:6,recipients:['maya','jules'],overrides:{},tasks:[]},
{id:'notify',name:'Even laten weten',message:'Ik voel me niet goed. Je hoeft niets te doen, ik wilde je alleen informeren.',recovery:'Ik ben weer opgeknapt.',duration:'',checkin:4,recipients:['maya','lou'],overrides:{},tasks:[]}],event:null};
let data,db,key,draft=null,contactDraft=null,view='home',busy=false,ready=false,revision=0;
let concepts={},conceptQueue=Promise.resolve(),conceptPending=0,conceptError=null,editorKey=null;
let restoreCandidate=null;
let importStage=null;
const online=window.AutofeverBridge||null;
const repeats={once:'Eenmalig',daily:'Dagelijks',weekly:'Wekelijks'};
async function seal(value){const iv=crypto.getRandomValues(new Uint8Array(12));return {iv,body:await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(value)))};}
async function unseal(value){return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:value.iv},key,value.body)));}
const request=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
async function openStore(){
 const r=indexedDB.open('autofever-editable-preview-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('vault');
 db=await request(r);
 key=await request(db.transaction('vault').objectStore('vault').get('key'));
 if(!key){const candidate=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await new Promise((resolve,reject)=>{const tx=db.transaction('vault','readwrite'),store=tx.objectStore('vault');const r=store.get('key');r.onsuccess=()=>{key=r.result||candidate;if(!r.result)store.put(key,'key');};tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});}
 const saved=await request(db.transaction('vault').objectStore('vault').get('data'));
 if(saved){const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:saved.iv},key,saved.body);data=JSON.parse(new TextDecoder().decode(plain));revision=saved.revision||0;if(data.version!==1||!Array.isArray(data.profiles)||!Array.isArray(data.contacts))throw Error('Opgeslagen gegevens hebben een onbekend formaat.');}
 else data=clone(seed);
 const storedConcepts=await request(db.transaction('vault').objectStore('vault').get('concepts'));
 if(storedConcepts)concepts=await unseal(storedConcepts);
 if(online)await online.init({db,seal,unseal,request,checkedWrite,esc,render,say,focusHeading,getData:()=>data,getRevision:()=>revision});
 ready=true;render();focusHeading();
}
function writeItems(items){return new Promise((resolve,reject)=>{const tx=db.transaction('vault','readwrite');for(const [id,value]of Object.entries(items))tx.objectStore('vault').put(value,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('Opslaan afgebroken'));});}
async function commit(next){
 await checkedWrite({data:await seal(next)},{data:revision});revision++;data=next;
}
function checkedWrite(items,expected){return new Promise((resolve,reject)=>{const tx=db.transaction('vault','readwrite'),store=tx.objectStore('vault');let left=Object.keys(expected).length,error=null;for(const [id,version]of Object.entries(expected)){const r=store.get(id);r.onsuccess=()=>{if((r.result?.revision||0)!==version){error=Object.assign(Error('Gegevens gewijzigd in een andere tab. Je concept blijft bewaard. Herlaad voordat je opnieuw opslaat.'),{code:'STALE'});tx.abort();return;}if(--left===0)for(const [key,value]of Object.entries(items))store.put({...value,revision:expected[key]+1},key);};}tx.oncomplete=resolve;tx.onerror=()=>reject(error||tx.error);tx.onabort=()=>reject(error||tx.error||Error('Opslaan afgebroken'));});}
function saveError(error){return error?.code==='STALE'?error.message:'Opslaan mislukt. Je invoer blijft open; probeer opnieuw.';}
function say(message,error=false){$('#toast').textContent=message;$('#toast').className=error?'error':'';}
function icon(name){return '<svg class="icon" aria-hidden="true"><use href="#'+name+'"/></svg>'}
function button(text,action,cls='secondary',id=''){return '<button type="button" class="'+cls+'" data-action="'+action+'"'+(id?' data-id="'+esc(id)+'"':'')+'>'+esc(text)+'</button>'}
function person(id){return data.contacts.find(c=>c.id===id);}
function selectedProfile(){return data.profiles.find(p=>p.id===data.defaultId)||data.profiles[0];}
function names(ids){return ids.map(id=>person(id)?.name).filter(Boolean).join(', ');}
function recipientsHtml(p){return p.recipients.map(id=>{const c=person(id);return c?'<div class="row"><div class="detail"><strong>'+esc(c.name)+'</strong><small>'+esc(c.group)+' · '+esc(c.channels.join(', '))+'</small></div></div>':''}).join('');}
function focusHeading(){$('#main').scrollTop=0;const h=$('main h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}}
async function move(next){await saveEditor();draft=null;contactDraft=null;editorKey=null;view=next;say('');render();window.scrollTo(0,0);$('#main').scrollTop=0;focusHeading();}
function editorLayout(){
 $('.bottom > .savebar')?.remove();
 const editing=['edit-profile','edit-person','update'].includes(view);$('.app').classList.toggle('editor-mode',editing);
 if(editing){const bar=$('main .savebar'),form=$('main form');if(bar&&form){bar.querySelectorAll('button:not([type]),button[type=submit]').forEach(b=>{b.type='submit';b.setAttribute('form',form.id);});$('.bottom').prepend(bar);}}
}
function conceptStatus(message){const el=$('#draft-status');if(el)el.textContent=message;}
function persistConcepts(patch=editorKey?{[editorKey]:clone(concepts[editorKey])}:{}){
 conceptPending++;conceptStatus('Concept wordt bewaard…');
 const job=conceptQueue.catch(()=>{}).then(async()=>{for(let attempt=0;attempt<8;attempt++){const stored=await request(db.transaction('vault').objectStore('vault').get('concepts'));const merged=stored?await unseal(stored):{};for(const[k,v]of Object.entries(patch)){if(v===null)delete merged[k];else merged[k]=v;}try{await checkedWrite({concepts:await seal(merged)},{concepts:stored?.revision||0});conceptError=null;return;}catch(error){if(error?.code!=='STALE'||attempt===7)throw error;}}});
 conceptQueue=job;job.then(()=>{conceptPending--;if(!conceptPending)conceptStatus('Concept bewaard · je actieve profiel is niet gewijzigd.');},error=>{conceptPending--;conceptError=error;conceptStatus('Concept bewaren mislukt. Blijf op dit scherm en probeer opnieuw.');});return job;
}
function captureEditor(){
