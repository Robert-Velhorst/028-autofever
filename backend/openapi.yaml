openapi: 3.1.0
info:
  title: Autofever lifecycle API
  version: 0.4.0
  description: |
    Local development or explicit hosted HTTPS-proxy boundary. Not deployed or connected to a provider.
    Every request requires the exact configured Host. POST additionally requires
    the exact configured Origin. Cross-site API requests and all query strings
    are rejected. No cookies, CORS or public provisioning. Owner routes require
    the opt-in local owner app or HostedApp; recipient-only mode returns 404 for those routes.
    Duplicate JSON keys and unknown body fields are rejected; body limit 8192 bytes
    except owner profile activation (2 MiB) and episode updates (32768 bytes).
    Successful POST responses contain a fresh view; repeat acknowledgment and
    repeating one's own accepted/completed action are safe. Concurrent episode
    closure may yield 404 even when an earlier mutation committed: re-read, do not
    infer rollback from a failed response. HostedApp adds bounded per-process
    global, client-IP and bearer quotas (429, Retry-After 60); development mode does not.
    HostedApp requires authenticated loopback proxy headers injected by the trusted edge,
    not by browser clients. The configured public origin is not yet deployed.
servers:
  - url: http://127.0.0.1:8080
security:
  - recipientCapability: []
paths:
  /api/v1/owner/episode:
    get:
      operationId: readLatestOwnerEpisode
      summary: Read the latest own episode, including a terminal one
      security: [{ownerCapability: []}]
      responses:
        '200': {$ref: '#/components/responses/OwnerView'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '405': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Temporary'}
  /api/v1/owner/export:
    get:
      operationId: exportOwnerEpisodeHistory
      summary: Read the authenticated owner's complete server-side episode history
      description: |
        The HTTPS owner client encrypts this response locally before offering a download.
        This endpoint itself returns authenticated JSON and must only be used through the
        configured same-origin connection. It excludes capability tokens and sender receipts.
      security: [{ownerCapability: []}]
      responses:
        '200': {$ref: '#/components/responses/OwnerExport'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '405': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Temporary'}
  /api/v1/owner/episodes:
    post:
      operationId: activateSavedOwnerProfile
      summary: Idempotently activate the saved default profile
      security: [{ownerCapability: []}]
      parameters: [{$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [command, profile, contacts, link_ttl]
              properties:
                command: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}
                profile: {$ref: '#/components/schemas/SavedProfile'}
                contacts:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: {$ref: '#/components/schemas/SavedContact'}
                link_ttl: {type: integer, minimum: 60, maximum: 604800}
      responses:
        '200': {$ref: '#/components/responses/OwnerView'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '405': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Temporary'}
  /api/v1/owner/episode-updates:
    post:
      operationId: createOwnerEpisodeUpdate
      summary: Idempotently queue an update for explicitly selected informed recipients
      description: |
        Requires a v3 database and an active episode for a new command. Only recipients
        whose initial notification is accepted may be selected. At most 50 updates per
        episode; another update is blocked while a previous update is queued, sending
        or uncertain. Same command/content replays without new jobs, including after
        closure. Changed content is 409. Selection order does not change identity.
        A successful response means queued, not sent/delivered/read. No renewed helper links.
      security: [{ownerCapability: []}]
      parameters: [{$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [episode_id, command, message, recipients]
              properties:
                episode_id: {type: string}
                command: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}
                message: {type: string, minLength: 1, maxLength: 2000}
                recipients:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/Identifier'}
      responses:
        '200': {$ref: '#/components/responses/OwnerView'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '405': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Temporary'}
  /api/v1/owner/episode-closures:
    post:
      operationId: closeOwnerEpisode
      summary: Recover or cancel an episode; never dispatch directly
      security: [{ownerCapability: []}]
      parameters: [{$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [episode_id, state, recovery_message]
              properties:
                episode_id: {type: string}
                state: {type: string, enum: [recovered, cancelled]}
                recovery_message: {type: [string, 'null'], maxLength: 10000}
              description: Cancellation requires null; recovery requires nonempty text. Repeating a terminal state does not replace its original message.
      responses:
        '200': {$ref: '#/components/responses/OwnerView'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '405': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Temporary'}
  /api/v1/owner/episode-checkins:
    post:
      operationId: confirmOwnerCheckin
      summary: Confirm a due check-in for the owner only
      description: |
        Requires the active owner episode and a saved profile check-in preference.
        A check-in is due at activation plus the configured interval, then at the
        same interval after each owner confirmation. It is shown when the owner
        opens or refreshes Autofever; no push, email, SMS or helper message is sent.
        Replaying the same command is safe. The response reports the next due time.
      security: [{ownerCapability: []}]
      parameters: [{$ref: '#/components/parameters/Origin'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [episode_id, command]
              properties:
                episode_id: {type: string}
                command: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}
      responses:
        '200': {$ref: '#/components/responses/OwnerView'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '405': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Temporary'}
  /api/v1/recipient:
    get:
      operationId: readRecipient
      summary: Read only this recipient's message and assigned tasks
      description: Does not acknowledge the message or claim any task.
      responses:
        '200': {$ref: '#/components/responses/View'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '405': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Temporary'}
  /api/v1/recipient/acknowledgment:
    post:
      operationId: acknowledgeRecipient
      summary: Explicitly acknowledge reading the message
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200': {$ref: '#/components/responses/View'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '405': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Temporary'}
  /api/v1/recipient/task-responses:
    post:
      operationId: respondToTask
      summary: Accept, decline or complete assigned help
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [task_id, action]
              properties:
                task_id: {type: string, pattern: '^[A-Za-z0-9_-]{1,80}$'}
                action: {type: string, enum: [accept, decline, complete]}
      responses:
        '200': {$ref: '#/components/responses/View'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '405': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Temporary'}
components:
  securitySchemes:
    ownerCapability:
      type: http
      scheme: bearer
      description: Privately provisioned 43-character owner capability; not a recipient capability.
    recipientCapability:
      type: http
      scheme: bearer
      description: 43-character base64url recipient capability; never in a query string.
  parameters:
    Origin:
      in: header
      name: Origin
      required: true
      schema: {type: string}
      description: Exact configured origin, including port.
  schemas:
    Identifier:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,80}$'
    SavedContact:
      type: object
      additionalProperties: false
      required: [id, name, group, phone, email, channels]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        name: {type: string, minLength: 1, maxLength: 80}
        group: {type: string, minLength: 1, maxLength: 80}
        phone: {type: string, maxLength: 40}
        email: {type: string, maxLength: 254}
        channels:
          type: array
          minItems: 1
          maxItems: 1
          items: {type: string, enum: [Email, SMS, WhatsApp]}
      description: Exactly the selected contacts are required. Email requires a valid email; SMS/WhatsApp require an international phone. No guessed first/fallback channel.
    SavedProfile:
      type: object
      additionalProperties: false
      required: [id, name, message, recovery, duration, checkin, recipients, overrides, tasks]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        name: {type: string, minLength: 1, maxLength: 80}
        message: {type: string, minLength: 1, maxLength: 2000}
        recovery: {type: string, minLength: 1, maxLength: 2000}
        duration: {type: string, maxLength: 120}
        checkin: {type: integer, minimum: 1, maximum: 168}
        recipients:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {$ref: '#/components/schemas/Identifier'}
        overrides:
          type: object
          propertyNames: {$ref: '#/components/schemas/Identifier'}
          additionalProperties: {type: string, maxLength: 2000}
        tasks:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, title, description, assignees]
            properties:
              id: {$ref: '#/components/schemas/Identifier'}
              title: {type: string, minLength: 1, maxLength: 120}
              description: {type: string, maxLength: 2000}
              assignees:
                type: array
                minItems: 1
                maxItems: 100
                uniqueItems: true
                items: {$ref: '#/components/schemas/Identifier'}
              when: {type: string, maxLength: 120}
              repeat: {type: string, enum: [once, daily, weekly]}
              backup: {type: string, maxLength: 80}
      description: Saved profile only. Task IDs unique; assignees and nonempty backup must belong to recipients. Recurrence and backup are preserved, not executed. In-app owner check-ins use the saved interval; they never send messages.
    OwnerView:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          oneOf:
            - {type: 'null'}
            - type: object
              additionalProperties: false
              required: [id, state, checkin, snapshot, notifications, recipients, tasks, updates]
              properties:
                id: {type: string}
                state: {type: string, enum: [active, recovered, cancelled]}
                checkin:
                  oneOf:
                    - {type: 'null'}
                    - type: object
                      additionalProperties: false
                      required: [interval_hours, last_confirmed_at, next_due_at, due]
                      properties:
                        interval_hours: {type: integer, minimum: 1, maximum: 168}
                        last_confirmed_at: {type: [integer, 'null']}
                        next_due_at: {type: integer}
                        due: {type: boolean}
                snapshot:
                  type: object
                  required: [recipients, tasks]
                  description: Original validated service snapshot, with preparation for owner-profile activations. Contains this owner's selected contacts but never recipient tokens.
                notifications:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, recipient, kind, status, attempts]
                    properties:
                      id: {type: string}
                      recipient: {type: string}
                      kind: {type: string, enum: [illness, recovery, update]}
                      status: {type: string, enum: [queued, sending, accepted, failed, uncertain, cancelled]}
                      attempts: {type: integer, minimum: 0}
                updates:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [version, command, message, recipients, created_at]
                    properties:
                      version: {type: integer, const: 1}
                      command: {type: string}
                      message: {type: string, maxLength: 2000}
                      recipients: {type: array, items: {type: string}}
                      created_at: {type: integer}
                recipients:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, acknowledged]
                    properties:
                      id: {type: string}
                      acknowledged: {type: boolean}
                tasks:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, state, claimant, declined_by]
                    properties:
                      id: {type: string}
                      state: {type: string, enum: [pending, accepted, completed, closed]}
                      claimant: {type: [string, 'null']}
                      declined_by: {type: array, items: {type: string}}
    OwnerExport:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [format, version, exported_at, episodes]
          properties:
            format: {type: string, const: autofever-owner-export}
            version: {type: integer, const: 1}
            exported_at: {type: integer}
            episodes:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [created_at, id, state, checkin, snapshot, notifications, updates, recipients, tasks]
                properties:
                  created_at: {type: integer}
                  id: {type: string}
                  state: {type: string, enum: [active, recovered, cancelled]}
                  checkin:
                    oneOf:
                      - {type: 'null'}
                      - type: object
                        required: [interval_hours, last_confirmed_at, next_due_at, due]
                        properties:
                          interval_hours: {type: integer, minimum: 1, maximum: 168}
                          last_confirmed_at: {type: [integer, 'null']}
                          next_due_at: {type: integer}
                          due: {type: boolean}
                  snapshot: {type: object, description: Owner-only immutable episode snapshot; capability tokens are excluded.}
                  notifications:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, recipient, kind, status, attempts]
                      properties:
                        id: {type: string}
                        recipient: {type: string}
                        kind: {type: string, enum: [illness, recovery, update]}
                        status: {type: string, enum: [queued, sending, accepted, failed, uncertain, cancelled]}
                        attempts: {type: integer, minimum: 0}
                  updates:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      additionalProperties: false
                      required: [version, command, message, recipients, created_at]
                      properties:
                        version: {type: integer, const: 1}
                        command: {type: string}
                        message: {type: string, maxLength: 2000}
                        recipients: {type: array, items: {type: string}}
                        created_at: {type: integer}
                  recipients:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, acknowledged]
                      properties:
                        id: {type: string}
                        acknowledged: {type: boolean}
                  tasks:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, state, claimant, declined_by]
                      properties:
                        id: {type: string}
                        state: {type: string, enum: [pending, accepted, completed, closed]}
                        claimant: {type: [string, 'null']}
                        declined_by: {type: array, items: {type: string}}
      description: Authenticated JSON response. The browser encrypts it with a user-supplied passphrase before download; this is not a restorable local-profile backup.
    RecipientView:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [message, acknowledged, tasks, updates]
          properties:
            message: {type: string}
            acknowledged: {type: boolean}
            updates:
              type: array
              maxItems: 50
              description: Only updates explicitly addressed to this recipient. Does not imply email delivery or reading; acknowledgment covers only the original message.
              items:
                type: object
                additionalProperties: false
                required: [message, created_at]
                properties:
                  message: {type: string, maxLength: 2000}
                  created_at: {type: integer}
            tasks:
              type: array
              maxItems: 100
              items:
                type: object
                additionalProperties: false
                required: [id, title, timing, status, claimed_by_you, declined_by_you]
                properties:
                  id: {type: string}
                  title: {type: string}
                  timing: {type: string}
                  description: {type: string, maxLength: 2000}
                  status: {type: string, enum: [pending, accepted, completed, closed]}
                  claimed_by_you: {type: boolean}
                  declined_by_you: {type: boolean}
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
  responses:
    OwnerView:
      description: Authoritative owner-scoped state. Null only for GET before the first episode. Cache-Control no-store.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OwnerView'}
    OwnerExport:
      description: Complete owner-scoped server history. Cache-Control no-store; browser encrypts before download.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OwnerExport'}
    View:
      description: Current scoped recipient view. All responses use Cache-Control no-store.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RecipientView'}
    Error:
      description: Generic error; no tokens, destinations, database details or other helper identities.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: Identical response for missing, unknown, expired, closed or unauthorized capability/resource.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: HostedApp quota exceeded before performing an application mutation.
      headers:
        Retry-After:
          schema: {type: string, const: '60'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Temporary:
      description: Internal or temporary failure; mutation outcome must not be assumed to have rolled back.
      headers:
        Retry-After:
          schema: {type: string, const: '5'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
